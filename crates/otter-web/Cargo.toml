[package]
name = "otter-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Web API surfaces for the active Otter runtime stack."

[dependencies]
otter-gc = { workspace = true }
otter-macros = { workspace = true }
otter-runtime = { workspace = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = "2"
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime", "gc", "gc-drc", "wat", "std"] }
wasm-encoder = "0.253"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }

[build-dependencies]
otter-compiler = { workspace = true }
otter-bytecode = { workspace = true }
otter-syntax = { workspace = true }

[dev-dependencies]
tempfile = "3"
otter-compiler = { workspace = true }
otter-bytecode = { workspace = true }
otter-syntax = { workspace = true }
otter-vm = { workspace = true }
tokio = { workspace = true }
wat = "1"
