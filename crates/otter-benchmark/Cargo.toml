[package]
name = "otter-benchmark"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Machine-readable benchmark result schema and command recorder for Otter."
default-run = "otter-benchmark"

[lints]
workspace = true

[features]
default = []
engine = [
    "dep:otter-bytecode",
    "dep:otter-compiler",
    "dep:otter-jit",
    "dep:otter-runtime",
    "dep:otter-syntax",
    "dep:otter-vm",
    "dep:smallvec",
    "dep:sysinfo",
    "dep:sha2",
]
rss = ["dep:sysinfo"]
warm-harness = ["dep:otter-syntax", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_span", "dep:sha2"]

[dependencies]
clap = { workspace = true }
otter-bytecode = { workspace = true, optional = true }
otter-compiler = { workspace = true, optional = true }
otter-jit = { workspace = true, optional = true }
otter-runtime = { workspace = true, optional = true }
otter-syntax = { workspace = true, optional = true }
otter-vm = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_ast_visit = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

[[bin]]
name = "otter-benchmark"
path = "src/main.rs"

[[bin]]
name = "otter-engine-benchmark"
path = "src/bin/engine.rs"
required-features = ["engine"]

[[bin]]
name = "otter-warm-harness"
path = "src/bin/warm_harness.rs"
required-features = ["warm-harness"]

[[bin]]
name = "otter-allocation-probe"
path = "src/bin/allocation_probe.rs"
required-features = ["engine"]

[[bin]]
name = "otter-engine-baseline"
path = "src/bin/baseline.rs"
required-features = ["engine"]

[[bin]]
name = "otter-resource-probe"
path = "src/bin/resource_probe.rs"
required-features = ["engine"]
